# What this repository publishes: ECCOFS scalar fields — surface temperature, salinity and height, temperature at 50 and 100 m, and heat content, from NOAA's open-data bucket
# `noaa-nos-eccofs-pds` — published, not drawn on the website's map (the
# owner, 2026-09-27). The fetcher is the site's `scripts/fetch-eccofs.py`,
# shared with `eccofs-model-currents-repo`: this repository's step is scoped with `--only=` to
# its own products, because a bare call would write the sibling's files and
# the write fence would refuse the run.
#
# - **Every `roots` entry must be one the site's `test-schema.mjs --roots`
#   publishes**, or the orchestrator exits 2.
# - **Paths are relative to the site checkout**: `scripts/...`.
# - **One regional grid per root, 0.04 degree, no tiles**, `regional: true` in
#   every header (the contract's rule for a model that covers part of the
#   ocean). Sizes measured 2026-09-27.
#
# **The budget.** Frames are 3-hourly and each run publishes the one at or
# before now, on a schedule every three hours: a frame is at most three hours
# old when published plus the three to the next run, and GitHub has delivered
# scheduled runs up to four hours late. Eight hours; re-measure after a week.
# The bucket's four-day posting lag does not enter while postings arrive —
# each covers about four days ahead — and when they stop, the frames run out
# and this budget is what says so.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# Named after the server: NOAA's open-data bucket.
[steps.eccofs]
cmd = ["python3", "scripts/fetch-eccofs.py", "--only=sst-eccofs,sss-eccofs,ssh-eccofs,temp50-eccofs,temp100-eccofs,ohc-eccofs,bottomt-eccofs,bottoms-eccofs,bottomdepth-eccofs"]
lane = "noaa-eccofs-bucket"

# **The day's means, from the model's daily averages files** (2026-10-10):
# the temperature, salinity and vertical velocity at Mercator's depths, the
# day before's temperature, salinity and sea surface height, and the
# surface's net heat flux and evaporation less rain. A file of 7.6 GB, read
# chunk by chunk with HTTP ranges, about 480 MB a three-dimensional variable;
# measured 2026-10-10 on a 16-core Mac at 65 to 117 s a quantity. Its own step
# on the same lane, and a run that finds every root already the day's writes
# nothing.
[steps.eccofs-avg]
cmd = ["python3", "scripts/fetch-eccofs.py", "--only=temp-eccofs,sal-eccofs,w-eccofs,temp-eccofs-prev,sal-eccofs-prev,ssh-eccofs-prev,qnet-eccofs,emp-eccofs"]
lane = "noaa-eccofs-bucket"
timeout_minutes = 30

# 12.5 MB
[products.sst-eccofs]
title = "ECCOFS sea surface temperature"
step = "eccofs"
roots = ["sst-eccofs.json"]
writes = ["sst-eccofs.json"]
max_age_hours = 8
namespace = ["python3", "scripts/fetch-eccofs.py", "--namespace", "--only=sst-eccofs"]

# 12.5 MB
[products.sss-eccofs]
