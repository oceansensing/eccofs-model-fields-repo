# **Heat content, from the daily history files since 2026-09-28**: tropical
# cyclone heat potential, the quantity and constants of ESPC's and
# Mercator's, integrated down each cell's own terrain-following levels from
# the 00 UTC snapshot's temperature at all 50 (481 MB of Range reads; 40 s
# from a home line, measured). Held every run to the quick-save file at the
# same moment: the top level against `temp_sur`, and the levels interpolated
# to 50 m against `temp_slice`. A daily snapshot's budget: 24 hours, three to
# the next run and four of GitHub's lateness — 30, Mercator's.

# 12.5 MB
[products.ohc-eccofs]
title = "ECCOFS ocean heat content"
step = "eccofs"
roots = ["ohc-eccofs.json"]
writes = ["ohc-eccofs.json"]
max_age_hours = 30
namespace = ["python3", "scripts/fetch-eccofs.py", "--namespace", "--only=ohc-eccofs"]

